<%@ page language="java" contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa User - CodeGym</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nhúng file CSS tùy chỉnh -->
    <link rel="stylesheet" href="${pageContext.request.contextPath}/css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-lg">
                    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-pen"></i> Cập nhật thông tin User</h4>
                        <a href="users" class="btn btn-dark btn-sm">Quay lại danh sách</a>
                    </div>
                    <div class="card-body p-4">
                        <!-- Form gửi dữ liệu cập nhật về Servlet với action=update -->
                        <form action="users?action=update" method="post">
                            <!-- Ẩn ID để truyền ngầm xuống Servlet -->
                            <input type="hidden" name="id" value="<c:out value='${user.id}' />">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ tên:</label>
                                <input type="text" name="name" class="form-control" value="<c:out value='${user.name}' />" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email:</label>
                                <input type="email" name="email" class="form-control" value="<c:out value='${user.email}' />" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Quốc gia:</label>
                                <input type="text" name="country" class="form-control" value="<c:out value='${user.country}' />" required>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="users" class="btn btn-secondary px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary px-4">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
